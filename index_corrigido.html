<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>Consulta de Produtos</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#17202a;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}header{background:#111827;color:white;padding:20px 16px;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px #0002}.wrap{max-width:900px;margin:auto}h1{font-size:23px;margin:0 0 4px}.sub{font-size:13px;color:#cbd5e1}.search{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap}input{flex:1;min-width:220px;padding:15px;border:0;border-radius:12px;font-size:17px;outline:0}button{border:0;border-radius:12px;padding:13px 16px;font-weight:700}.blue{background:#2563eb;color:white}.gray{background:#e5e7eb}main{padding:18px 16px 40px}.status{font-size:13px;color:#6b7280;margin:5px 0 12px}.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 2px 8px #0000000a}.click{cursor:pointer}.top{display:flex;justify-content:space-between;gap:10px}.title{font-weight:800;font-size:17px}.code{font-size:12px;color:#6b7280;margin-top:4px}.badge{font-size:11px;background:#eef2ff;color:#3730a3;padding:5px 8px;border-radius:999px}.grid,.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.info{background:#f8fafc;border-radius:10px;padding:10px}.label{font-size:11px;color:#6b7280}.value{font-weight:700;margin-top:2px;word-break:break-word}.bal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.bal div{background:#f0fdf4;border:1px solid #dcfce7;border-radius:10px;padding:9px}.bal b{display:block;font-size:16px;color:#087443}.bal span{font-size:10px;color:#6b7280}.empty{text-align:center;padding:50px 20px;color:#6b7280}.section{font-size:14px;font-weight:800;margin:18px 0 8px}@media(max-width:560px){.grid,.kv{grid-template-columns:1fr}.top{display:block}.badge{display:inline-block;margin-top:8px}}
</style></head><body>
<header><div class="wrap"><h1>🔎 Consulta de Produtos</h1><div class="sub" id="count">Carregando...</div><div class="search"><input id="q" placeholder="Código interno, referência ou descrição..." autofocus><button class="blue" onclick="buscar()">Buscar</button><button class="gray" onclick="limpar()">Limpar</button></div></div></header>
<main class="wrap"><section id="results"><div id="status" class="status">Digite um código, referência ou parte da descrição.</div><div id="list"></div></section><section id="detail" style="display:none"><button class="gray" onclick="voltar()">← Voltar</button><div id="detailCard"></div></section></main>
<script>
let DB=[];
const $=id=>document.getElementById(id);
const norm=s=>String(s??'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]+/g,' ').trim();
const compact=s=>norm(s).replace(/ /g,'');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=v=>v===''||isNaN(Number(v))?'—':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=v=>v===''||v==null?'—':Number.isFinite(Number(v))?Number(v).toLocaleString('pt-BR',{maximumFractionDigits:3}):esc(v);
function score(r,raw){
 let x=norm(raw),c=compact(raw),d=norm(r._descricao);
 if(!x)return 0;
 if(r._codigo===raw.trim())return 1000;if(r._referencia===raw.trim())return 950;if(r._barcode===raw.trim())return 930;
 if(compact(r._codigo)===c)return 900;if(compact(r._referencia)===c)return 850;if(compact(r._barcode)===c)return 830;
 if(d===x)return 800;
 let ts=x.split(' ').filter(Boolean),hit=ts.filter(t=>d.includes(t)).length;
 if(hit===ts.length)return 700+hit*10;if(hit)return 300+hit*10;
 return 0;
}
function buscar(){
 let raw=$('q').value.trim();if(!raw){$('status').textContent='Digite um código, referência ou parte da descrição.';$('list').innerHTML='';return}
 let arr=DB.map(r=>({r,s:score(r,raw)})).filter(x=>x.s).sort((a,b)=>b.s-a.s).map(x=>x.r);
 $('status').textContent=arr.length+' resultado(s) para “'+raw+'”';$('list').innerHTML='';
 if(!arr.length){$('list').innerHTML='<div class="empty">Nenhum produto encontrado.<br><br>Tente outra parte da descrição, o código interno ou a referência.</div>';return}
 arr.slice(0,100).forEach(r=>{
  let s=r._saldo||{};let e=document.createElement('div');e.className='card click';
  e.innerHTML='<div class="top"><div><div class="title">'+esc(r['Descrição'])+'</div><div class="code">Código: <b>'+esc(r._codigo)+'</b> · Referência: <b>'+esc(r._referencia)+'</b></div></div><span class="badge">'+esc(r['Fabricante']||'SEM FABRICANTE')+'</span></div>'+
  '<div class="grid"><div class="info"><div class="label">Código de barras</div><div class="value">'+esc(r._barcode||'—')+'</div></div><div class="info"><div class="label">Grupo</div><div class="value">'+esc(r['Grupo']||'—')+'</div></div><div class="info"><div class="label">Unidade</div><div class="value">'+esc(r['Unid.']||'—')+'</div></div><div class="info"><div class="label">Preço</div><div class="value">'+money(r['Vlr. Venda'])+'</div></div></div>'+
  '<div class="bal"><div><b>'+num(s.lpx)+'</b><span>LPX</span></div><div><b>'+num(s.atak)+'</b><span>ATAKADÃO</span></div><div><b>'+num(s.brilha)+'</b><span>BRILHARES</span></div></div>';
  e.onclick=()=>detalhe(r);$('list').appendChild(e);
 });
}
function detalhe(r){
 $('results').style.display='none';$('detail').style.display='block';
 let s=r._saldo||{},skip=['_codigo','_referencia','_barcode','_descricao','_saldo'];
 let fields=Object.keys(r).filter(k=>!skip.includes(k));
 let cells=fields.map(k=>'<div class="info"><div class="label">'+esc(k)+'</div><div class="value">'+((k.includes('Vlr.')?money(r[k]):esc(r[k])||'—'))+'</div></div>').join('');
 $('detailCard').innerHTML='<div class="card"><div class="title">'+esc(r['Descrição'])+'</div><div class="code">Código: <b>'+esc(r._codigo)+'</b> · Referência: <b>'+esc(r._referencia)+'</b></div><div class="section">Saldos por empresa</div><div class="bal"><div><b>'+num(s.lpx)+'</b><span>LPX</span></div><div><b>'+num(s.atak)+'</b><span>ATAKADÃO</span></div><div><b>'+num(s.brilha)+'</b><span>BRILHARES</span></div></div><div class="section">Informações do cadastro</div><div class="kv">'+cells+'</div></div>';
 window.scrollTo({top:0,behavior:'smooth'});
}
function voltar(){$('detail').style.display='none';$('results').style.display='block'}
function limpar(){$('q').value='';$('list').innerHTML='';$('status').textContent='Digite um código, referência ou parte da descrição.';$('q').focus()}
$('q').addEventListener('keydown',e=>{if(e.key==='Enter')buscar()});$('q').addEventListener('input',()=>{if($('q').value.trim().length>=3)buscar()});
fetch('./produtos.json?v=20261005', {cache:'no-store'})
.then(r=>{if(!r.ok) throw new Error('HTTP '+r.status); return r.json();})
.then(d=>{DB=Array.isArray(d)?d:[];$('count').textContent=DB.length.toLocaleString('pt-BR')+' produtos carregados · base local';})
.catch(err=>{$('count').textContent='Erro ao carregar a base';$('status').textContent='Não foi possível carregar produtos.json. Recarregue a página (Ctrl+Shift+R).';console.error(err);});
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));}</script></body></html>
